[project]
name = "claude-genmon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
claude-genmon = "claude_genmon.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_genmon"]

[tool.black]
line-length = 99

[tool.isort]
profile = "black"
line-length = 99
